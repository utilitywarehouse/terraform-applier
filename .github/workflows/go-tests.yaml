name: Go tests

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          run: |
            version=$(sed -n 's/^ENV STRONGBOX_VERSION=//p' Dockerfile)
            mkdir -p .bin
            curl -Ls "https://github.com/uw-labs/strongbox/releases/download/v${version}/strongbox_${version}_linux_amd64" \
              -o .bin/strongbox
            chmod +x .bin/strongbox
            export PATH="$PWD/.bin:$PATH"

            conftest=$(sed -n 's/^ENV CONFTEST_VERSION=//p' Dockerfile)
            curl -Ls https://github.com/open-policy-agent/conftest/releases/download/v${conftest}/conftest_${conftest}_Linux_x86_64.tar.gz \
                | tar xz -C /usr/local/bin conftest \
            chmod +x /usr/local/bin/conftest

            go test -race -v ./...
