git_mirror:
  defaults:
    root: /src
    interval: 30s
    mirror_timeout: 2m
    git_gc: always
    auth:
      ssh_key_path: /etc/git-secret/ssh
      ssh_known_hosts_path: /etc/git-secret/known_hosts
  repositories:
    - remote: git@github.com:utilitywarehouse/terraform-applier.git

# Policy enforcement is optional. Set paths to Rego bundles to enable.
#   hard_deny:
#     - /policies/hard
#   soft_deny:
#     - /policies/soft
#   data:
#     - /policies/data
policies: {}
